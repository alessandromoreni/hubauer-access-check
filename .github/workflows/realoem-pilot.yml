name: RealOEM ECE pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/realoem-pilot.yml]
permissions: {}
jobs:
  pilot:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run bounded RealOEM ECE pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install HTML and robots parsers
        run: python3 -m pip install 'beautifulsoup4==4.13.4' 'protego==0.4.0'
      - name: Check robots and verify a bounded ECE sample
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import parse_qs, urlencode, urlsplit
          from urllib.request import Request, build_opener, HTTPRedirectHandler

          from bs4 import BeautifulSoup
          from protego import Protego

          origin = "https://www.realoem.com"
          base = origin + "/bmw/enUS/"
          product = "OilStationCatalogPilot"
          user_agent = product + "/1.0 (+https://github.com/alessandromoreni/hubauer-access-check)"
          chapters = {"02", "11", "13", "17", "18", "23", "24", "27", "28", "31", "33"}
          indexes = (
              ("BMW F70 32GE", "32GE-EUR-01-2025-F70-BMW-116"),
              ("BMW i5 41HG", "41HG-EUR---G60-BMW-i5+M60+xDrive"),
              ("MINI F66 21GD", "21GD-EUR-03-2025-F66-Mini-Cooper_S"),
          )
          # Exact catalogue fixtures from recent generations. The pilot does
          # not discover or request any other variants.
          diagrams = (
              ("31GE", "28_0096", "31GE-EUR-06_2023_F70_BMW_116"),
              ("32GE", "28_0096", "32GE-EUR-03_2024_F70_BMW_116"),
              ("41HG", "17_1965", "41HG-EUR---G60-BMW-i5+M60+xDrive"),
              ("21GD", "28_0146", "21GD-EUR-03-2025-F66-Mini-Cooper_S"),
          )

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())
          delay = 2.0
          last_request = None

          def report(message):
              print(message, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"- {message}\n")

          def fetch(url, label, mime, limit):
              global last_request
              if last_request is not None:
                  time.sleep(max(0, delay - (time.monotonic() - last_request)))
              last_request = time.monotonic()
              try:
                  with opener.open(Request(url, headers={"User-Agent": user_agent}), timeout=16) as response:
                      report(f"{label}: HTTP {response.status}")
                      data = response.read(limit + 1)
                      if response.headers.get_content_type() != mime or len(data) > limit:
                          raise SystemExit(f"{label}: unexpected response format or size")
                      return data
              except HTTPError as error:
                  report(f"{label}: HTTP {error.code}")
                  retry = error.headers.get("Retry-After", "")
                  if re.fullmatch(r"[A-Za-z0-9 :,+-]{1,64}", retry):
                      report(f"Retry-After: {retry}")
                  if label == "robots.txt" and error.code in {404, 410}:
                      return b""
                  raise SystemExit(f"{label}: stopped on HTTP {error.code}")
              except (URLError, TimeoutError):
                  raise SystemExit(f"{label}: connection failed")

          raw = fetch(origin + "/robots.txt", "robots.txt", "text/plain", 512000)
          rules = Protego.parse(raw.decode("utf-8-sig"))
          crawl_delay = rules.crawl_delay(product)
          request_rate = rules.request_rate(product)
          if crawl_delay is not None:
              delay = max(delay, float(crawl_delay))
          if request_rate is not None:
              delay = max(delay, request_rate.seconds / request_rate.requests)
          if delay > 15:
              raise SystemExit("robots.txt: requested rate requires a separate schedule")

          def html(path, params, label):
              url = base + path + "?" + urlencode(params, safe="+")
              if not rules.can_fetch(url, product):
                  report(f"{label}: stopped by robots.txt")
                  raise SystemExit(1)
              data = fetch(url, label, "text/html", 2500000)
              soup = BeautifulSoup(data, "html.parser")
              if soup.select_one("#challenge-form, iframe[src*='captcha'], [id='cf-challenge-running']"):
                  raise SystemExit(f"{label}: interactive verification required")
              return soup

          for label, model in indexes:
              page = html("partgrp", {"id": model}, label)
              groups = set()
              for link in page.select("a[href]"):
                  query = parse_qs(urlsplit(link["href"]).query)
                  groups.update(query.get("mg", ()))
              if not groups:
                  raise SystemExit(f"{label}: catalog groups not found")
              report(f"{label}: requested chapters listed {', '.join(sorted(chapters & groups))}")
              report(f"{label}: requested chapters not listed {', '.join(sorted(chapters - groups))}")

          for model, diagram, variant in diagrams:
              label = f"{model} diagram {diagram}"
              if diagram.split("_")[0] not in chapters:
                  raise SystemExit(f"{label}: outside chapter scope")
              page = html("showparts", {"diagId": diagram, "id": variant}, label)
              for table in page.find_all("table"):
                  header = next((row for row in table.find_all("tr")
                                 if "part number" in row.get_text(" ", strip=True).lower()), None)
                  if header is None:
                      continue
                  columns = [cell.get_text(" ", strip=True).lower() for cell in header.find_all(["th", "td"], recursive=False)]
                  if "part number" not in columns:
                      continue
                  index = columns.index("part number")
                  count = 0
                  for row in table.find_all("tr"):
                      cells = row.find_all("td", recursive=False)
                      if len(cells) > index:
                          number = "".join(cells[index].get_text(strip=True).split())
                          count += bool(re.fullmatch(r"[A-Z0-9]{11}", number, re.IGNORECASE))
                  if count:
                      report(f"{label}: {count} OEM rows, columns parsed by header")
                      break
              else:
                  raise SystemExit(f"{label}: OEM rows not verified")
          PY
