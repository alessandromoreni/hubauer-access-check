name: Hubauer access check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/hubauer-access.yml]
permissions: {}
jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Fix robots group selection for Hubauer access check'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check robots and one public model page
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          origin = "https://www.hubauer-shop.de"
          model = origin + "/it/carparts/1er-parts/1-5-t/32ge-f70-b38l/116-5-tuerer-f70-motor-32ge/"
          agent = "HubauerAccessCheck/1.0 (+https://github.com/alessandromoreni/hubauer-access-check)"

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = build_opener(NoRedirect())

          def fetch(url, label, max_bytes):
              try:
                  with opener.open(Request(url, headers={"User-Agent": agent}), timeout=20) as response:
                      print(f"{label}: HTTP {response.status}", flush=True)
                      return response.headers.get_content_type(), response.read(max_bytes + 1)
              except HTTPError as error:
                  print(f"{label}: HTTP {error.code}", flush=True)
                  retry_after = error.headers.get("Retry-After", "")
                  if re.fullmatch(r"[A-Za-z0-9 :,+-]{1,64}", retry_after):
                      print(f"Retry-After: {retry_after}")
                  raise SystemExit(1)
              except (URLError, TimeoutError):
                  raise SystemExit(f"{label}: connection failed")

          kind, data = fetch(origin + "/robots.txt", "robots.txt", 512_000)
          if kind != "text/plain" or len(data) > 512_000:
              raise SystemExit("Stopped: robots.txt was not available as a complete plain-text file")
          path = urlsplit(model).path
          groups = []
          names = []
          rules = []
          started_rules = False
          for line in data.decode("utf-8-sig").splitlines():
              key, _, value = line.split("#", 1)[0].partition(":")
              key, value = key.strip().lower(), value.strip()
              if key == "user-agent" and value:
                  if started_rules:
                      groups.append((names, rules))
                      names, rules = [], []
                      started_rules = False
                  names.append(value.lower())
              elif names and key in {"allow", "disallow", "crawl-delay", "request-rate", "visit-time"}:
                  rules.append((key, value))
                  started_rules = True
          if names:
              groups.append((names, rules))

          product = agent.split("/", 1)[0].lower()
          applicable = [rules for names, rules in groups if product in names]
          if not applicable:
              applicable = [rules for names, rules in groups if "*" in names]
          if not applicable:
              raise SystemExit("Stopped: no applicable robots.txt group could be verified")

          matches = []
          for rules in applicable:
              for key, value in rules:
                  if key not in {"allow", "disallow"}:
                      raise SystemExit("Stopped: crawl schedule requires manual review")
                  if not value:
                      continue
                  if "%" in value or not value.isascii() or not value.startswith("/"):
                      raise SystemExit("Stopped: path rule requires manual review")
                  pattern = re.escape(value.removesuffix("$")).replace(r"\*", ".*")
                  if re.match(pattern + (r"\Z" if value.endswith("$") else ""), path):
                      matches.append((len(value), key == "allow"))
          if matches and not max(matches)[1]:
              raise SystemExit("Stopped: robots.txt disallows the model page")
          print("robots.txt: applicable rules permit the model page", flush=True)
          time.sleep(1.1)
          kind, data = fetch(model, "F70 model page", 2_000_000)
          if kind != "text/html" or len(data) > 2_000_000:
              raise SystemExit("Stopped: the model response was not complete HTML")
          # Record only whether the public identifiers occur, never the page contents.
          print("Model identifiers found:", sum(token in data.upper() for token in (b"31GE", b"32GE")))
          if not all(token in data.upper() for token in (b"32GE", b"F70")):
              raise SystemExit("Stopped: expected F70 model markers not found")
          PY
